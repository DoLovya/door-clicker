<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Clicker Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #bbb;
            transition: background 0.3s ease;
        }

        .status-dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.5);
        }

        .status-dot.connecting {
            background: #FFC107;
            box-shadow: 0 0 6px rgba(255, 193, 7, 0.5);
            animation: pulse 1.2s infinite;
        }

        .status-dot.disconnected {
            background: #bbb;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fafafa;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="password"]:focus {
            border-color: #1677ff;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 4px;
        }

        .btn-primary {
            background: #1677ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #4096ff;
        }

        .btn-secondary {
            background: #fff;
            color: #1677ff;
            border: 1px solid #1677ff;
        }

        .btn-secondary:hover {
            background: #e6f4ff;
        }

        .btn-danger {
            background: #fff;
            color: #ff4d4f;
            border: 1px solid #ff4d4f;
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #fff1f0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .door-button {
            display: block;
            width: 100%;
            padding: 28px;
            font-size: 20px;
            font-weight: 600;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            letter-spacing: 4px;
        }

        .door-button:hover {
            background: #45a049;
        }

        .door-button:active {
            transform: scale(0.98);
        }

        .log-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .log-filter {
            padding: 6px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
        }

        .log-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            background: #fafafa;
        }

        .log-empty {
            text-align: center;
            padding: 32px;
            color: #999;
            font-size: 13px;
        }

        .log-entry {
            display: flex;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            align-items: flex-start;
            gap: 8px;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #999;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
            font-size: 12px;
            white-space: nowrap;
        }

        .log-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .log-badge.info {
            background: #e6f4ff;
            color: #1677ff;
        }

        .log-badge.send {
            background: #e8f8e8;
            color: #52c41a;
        }

        .log-badge.receive {
            background: #fff7e6;
            color: #fa8c16;
        }

        .log-badge.error {
            background: #fff1f0;
            color: #ff4d4f;
        }

        .log-content {
            flex: 1;
            min-width: 0;
        }

        .log-message {
            color: #333;
            word-break: break-all;
        }

        .log-detail {
            margin-top: 4px;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
            font-size: 12px;
            color: #666;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-detail.collapsed {
            max-height: 0;
            padding: 0 8px;
            margin: 0;
            overflow: hidden;
            border: none;
            transition: all 0.2s ease;
        }

        .log-summary {
            color: #666;
            font-size: 12px;
            cursor: pointer;
        }

        .log-summary:hover {
            color: #1677ff;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #52c41a;
        }

        .toast.error {
            background: #ff4d4f;
        }

        .toast.info {
            background: #1677ff;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 16px;
                border-radius: 10px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
            }

            .door-button {
                padding: 24px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:-8px">
            <a href="/" style="color:#1677ff;font-size:13px;text-decoration:none">← 返回开门页</a>
            <button class="btn btn-danger" id="btnLogout" style="padding:4px 10px;font-size:12px">退出登录</button>
        </div>

        <!-- MQTT 连接配置 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">MQTT 连接配置</div>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">未连接</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="broker">服务器地址</label>
                    <input type="text" id="broker" placeholder="例如: broker.example.com">
                </div>
                <div class="form-group">
                    <label for="port">端口</label>
                    <input type="number" id="port" placeholder="例如: 1883" min="1" max="65535">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="选填">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="选填">
                </div>
            </div>

            <div class="form-group">
                <label for="doorTopic">开门 Topic</label>
                <input type="text" id="doorTopic" placeholder="例如: door/00094E53">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnSaveConfig">保存配置</button>
                <button class="btn btn-secondary" id="btnTestConnection">测试连接</button>
            </div>
        </div>

        <!-- 修改密码 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">修改管理员密码</div>
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少4位">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnChangePassword">修改密码</button>
            </div>
        </div>

        <!-- 开门控制 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">开门控制</div>
            </div>
            <button class="door-button" id="btnOpenDoor">开 门</button>
        </div>

        <!-- 日志 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">通信日志</div>
                <div class="status-indicator">
                    <button class="btn btn-secondary" id="btnRefreshLogs" style="padding: 4px 10px; font-size: 12px;">刷新</button>
                    <button class="btn btn-danger" id="btnClearLogs" style="padding: 4px 10px; font-size: 12px;">清空</button>
                </div>
            </div>

            <div class="log-toolbar">
                <select class="log-filter" id="logFilter">
                    <option value="">全部</option>
                    <option value="send">发送</option>
                    <option value="receive">接收</option>
                    <option value="info">信息</option>
                    <option value="error">错误</option>
                </select>
            </div>

            <div class="log-list" id="logList">
                <div class="log-empty">加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || 'info');
            setTimeout(function () {
                toast.className = 'toast ' + (type || 'info');
            }, 2500);
        }

        function setStatus(status) {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            dot.className = 'status-dot ' + status;
            var statusMap = {
                connected: '已连接',
                connecting: '连接中',
                disconnected: '未连接'
            };
            text.textContent = statusMap[status] || '未知';
        }

        function loadConfig() {
            fetch('/api/config')
                .then(function (res) { return res.json(); })
                .then(function (config) {
                    document.getElementById('broker').value = config.mqttServer || '';
                    document.getElementById('port').value = config.mqttPort || 1883;
                    document.getElementById('username').value = config.mqttUsername || '';
                    document.getElementById('password').value = config.mqttPassword || '';
                    document.getElementById('doorTopic').value = config.doorTopic || '';
                })
                .catch(function () {
                    showToast('加载配置失败', 'error');
                });
        }

        function saveConfig() {
            var btn = document.getElementById('btnSaveConfig');
            btn.disabled = true;
            btn.textContent = '保存中...';

            var config = {
                mqttServer: document.getElementById('broker').value.trim(),
                mqttPort: parseInt(document.getElementById('port').value) || 1883,
                mqttUsername: document.getElementById('username').value.trim(),
                mqttPassword: document.getElementById('password').value.trim(),
                doorTopic: document.getElementById('doorTopic').value.trim()
            };

            fetch('/api/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('配置保存成功', 'success');
                })
                .catch(function () {
                    showToast('配置保存失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '保存配置';
                });
        }

        function testConnection() {
            var btn = document.getElementById('btnTestConnection');
            btn.disabled = true;
            btn.textContent = '测试中...';
            setStatus('connecting');
            showToast('正在测试连接...', 'info');

            fetch('/api/mqtt/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.success) {
                        setStatus('connected');
                        showToast('连接成功', 'success');
                    } else {
                        setStatus('disconnected');
                        showToast('连接失败: ' + (data.message || '未知错误'), 'error');
                    }
                })
                .catch(function () {
                    setStatus('disconnected');
                    showToast('连接测试失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '测试连接';
                });
        }

        function loadStatus() {
            fetch('/api/mqtt/status')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    setStatus(data.connected ? 'connected' : 'disconnected');
                })
                .catch(function () {
                    setStatus('disconnected');
                });
        }

        function openDoor() {
            fetch('/api/open/door', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    showToast('开门指令已发送', 'success');
                })
                .catch(function () {
                    showToast('开门指令发送失败', 'error');
                });
        }

        function loadLogs() {
            var filter = document.getElementById('logFilter').value;
            var url = '/api/logs';
            if (filter) {
                url += '?type=' + encodeURIComponent(filter);
            }

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (logs) {
                    var list = document.getElementById('logList');
                    list.innerHTML = '';

                    if (!logs || logs.length === 0) {
                        list.innerHTML = '<div class="log-empty">暂无日志</div>';
                        return;
                    }

                    var reversed = logs.slice().reverse();
                    reversed.forEach(function (log) {
                        var entry = document.createElement('div');
                        entry.className = 'log-entry';

                        var time = document.createElement('span');
                        time.className = 'log-time';
                        time.textContent = log.timestamp || '';

                        var badge = document.createElement('span');
                        badge.className = 'log-badge ' + (log.type || 'info');
                        var typeMap = { send: '发送', receive: '接收', info: '信息', error: '错误' };
                        badge.textContent = typeMap[log.type] || log.type;

                        var content = document.createElement('div');
                        content.className = 'log-content';

                        var message = document.createElement('div');
                        message.className = 'log-message';
                        message.textContent = log.message || '';
                        content.appendChild(message);

                        if (log.payload) {
                            var detail = document.createElement('div');
                            detail.className = 'log-detail collapsed';
                            detail.textContent = (log.topic ? 'Topic: ' + log.topic + '\n' : '') + 'Payload: ' + log.payload;
                            var summary = document.createElement('div');
                            summary.className = 'log-summary';
                            summary.textContent = '点击查看详情';
                            summary.onclick = function () {
                                detail.classList.toggle('collapsed');
                                summary.textContent = detail.classList.contains('collapsed') ? '点击查看详情' : '收起详情';
                            };
                            content.appendChild(summary);
                            content.appendChild(detail);
                        }

                        entry.appendChild(time);
                        entry.appendChild(badge);
                        entry.appendChild(content);
                        list.appendChild(entry);
                    });
                })
                .catch(function () {
                    var list = document.getElementById('logList');
                    list.innerHTML = '<div class="log-empty">加载日志失败</div>';
                });
        }

        function clearLogs() {
            if (!confirm('确定要清空所有日志吗？')) return;

            var btn = document.getElementById('btnClearLogs');
            btn.disabled = true;
            btn.textContent = '清空中...';

            fetch('/api/logs', {
                method: 'DELETE'
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('日志已清空', 'success');
                    loadLogs();
                })
                .catch(function () {
                    showToast('清空日志失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '清空';
                });
        }

        function changePassword() {
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            if (!newPwd || newPwd.length < 4) {
                showToast('密码至少4位', 'error');
                return;
            }
            if (newPwd !== confirmPwd) {
                showToast('两次密码不一致', 'error');
                return;
            }

            var btn = document.getElementById('btnChangePassword');
            btn.disabled = true;
            btn.textContent = '修改中...';

            fetch('/api/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: newPwd })
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('密码修改成功', 'success');
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                })
                .catch(function () {
                    showToast('密码修改失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '修改密码';
                });
        }

        document.getElementById('btnSaveConfig').onclick = saveConfig;
        document.getElementById('btnTestConnection').onclick = testConnection;
        document.getElementById('btnOpenDoor').onclick = openDoor;
        document.getElementById('btnRefreshLogs').onclick = loadLogs;
        document.getElementById('btnClearLogs').onclick = clearLogs;
        document.getElementById('logFilter').onchange = loadLogs;
        document.getElementById('btnLogout').onclick = function () {
            if (!confirm('确定要退出登录吗？')) return;
            fetch('/api/auth/logout', { method: 'POST' })
                .then(function () { window.location.href = '/login'; })
                .catch(function () { window.location.href = '/login'; });
        };
        document.getElementById('btnSaveConfig').onclick = saveConfig;

        document.getElementById('btnChangePassword').onclick = changePassword;

        loadConfig();
        loadStatus();
        loadLogs();

        setInterval(loadLogs, 5000);
    </script>
</body>

</html>
