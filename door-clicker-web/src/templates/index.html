<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Clicker Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:-8px">
            <a href="/" style="color:#1677ff;font-size:13px;text-decoration:none">← 返回开门页</a>
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="https://github.com/DoLovya/door-clicker" target="_blank" rel="noopener" title="GitHub" style="color:#888;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GitHub
                </a>
                <button class="btn btn-danger" id="btnLogout" style="padding:4px 10px;font-size:12px">退出登录</button>
            </div>
        </div>

        <!-- MQTT 连接配置 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">MQTT 连接配置</div>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">未连接</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="broker">服务器地址</label>
                    <input type="text" id="broker" placeholder="例如: broker.example.com">
                </div>
                <div class="form-group">
                    <label for="port">端口</label>
                    <input type="number" id="port" placeholder="例如: 1883" min="1" max="65535">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="选填">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="选填">
                </div>
            </div>

            <div class="form-group">
                <label for="doorTopic">开门 Topic</label>
                <input type="text" id="doorTopic" placeholder="例如: door/00094E53">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnSaveConfig">保存配置</button>
                <button class="btn btn-secondary" id="btnTestConnection">测试连接</button>
            </div>
        </div>

        <!-- 舵机角度配置 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">舵机角度配置</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="openAngle">开门角度 (°)</label>
                    <input type="number" id="openAngle" placeholder="90" min="0" max="180">
                </div>
                <div class="form-group">
                    <label for="openDuration">开门延时 (ms)</label>
                    <input type="number" id="openDuration" placeholder="200" min="100" max="5000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="closeAngle">关门角度 (°)</label>
                    <input type="number" id="closeAngle" placeholder="0" min="0" max="180">
                </div>
                <div class="form-group">
                    <label for="closeDuration">关门延时 (ms)</label>
                    <input type="number" id="closeDuration" placeholder="200" min="100" max="5000">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnServoConfig">保存舵机配置</button>
                <button class="btn btn-secondary" id="btnServoTest">测试舵机</button>
            </div>
        </div>

        <!-- 修改密码 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">修改管理员密码</div>
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少4位">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnChangePassword">修改密码</button>
            </div>
        </div>

        <!-- 开门控制 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">开门控制</div>
            </div>
            <button class="door-button" id="btnOpenDoor">开 门</button>
        </div>

        <!-- 日志 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">通信日志</div>
                <div class="status-indicator">
                    <button class="btn btn-secondary" id="btnRefreshLogs" style="padding: 4px 10px; font-size: 12px;">刷新</button>
                    <button class="btn btn-danger" id="btnClearLogs" style="padding: 4px 10px; font-size: 12px;">清空</button>
                </div>
            </div>

            <div class="log-toolbar">
                <select class="log-filter" id="logFilter">
                    <option value="">全部</option>
                    <option value="send">发送</option>
                    <option value="receive">接收</option>
                    <option value="info">信息</option>
                    <option value="error">错误</option>
                </select>
            </div>

            <div class="log-list" id="logList">
                <div class="log-empty">加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || 'info');
            setTimeout(function () {
                toast.className = 'toast ' + (type || 'info');
            }, 2500);
        }

        function setStatus(status) {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            dot.className = 'status-dot ' + status;
            var statusMap = {
                connected: '已连接',
                connecting: '连接中',
                disconnected: '未连接'
            };
            text.textContent = statusMap[status] || '未知';
        }

        function loadConfig() {
            fetch('/api/config')
                .then(function (res) { return res.json(); })
                .then(function (config) {
                    document.getElementById('broker').value = config.mqttServer || '';
                    document.getElementById('port').value = config.mqttPort || 1883;
                    document.getElementById('username').value = config.mqttUsername || '';
                    document.getElementById('password').value = config.mqttPassword || '';
                    document.getElementById('doorTopic').value = config.doorTopic || '';
                    document.getElementById('openAngle').value = config.openAngle !== undefined ? config.openAngle : 90;
                    document.getElementById('openDuration').value = config.openDuration !== undefined ? config.openDuration : 200;
                    document.getElementById('closeAngle').value = config.closeAngle !== undefined ? config.closeAngle : 0;
                    document.getElementById('closeDuration').value = config.closeDuration !== undefined ? config.closeDuration : 200;
                })
                .catch(function () {
                    showToast('加载配置失败', 'error');
                });
        }

        function saveConfig() {
            var btn = document.getElementById('btnSaveConfig');
            btn.disabled = true;
            btn.textContent = '保存中...';

            var config = {
                mqttServer: document.getElementById('broker').value.trim(),
                mqttPort: parseInt(document.getElementById('port').value) || 1883,
                mqttUsername: document.getElementById('username').value.trim(),
                mqttPassword: document.getElementById('password').value.trim(),
                doorTopic: document.getElementById('doorTopic').value.trim()
            };

            fetch('/api/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('配置保存成功', 'success');
                })
                .catch(function () {
                    showToast('配置保存失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '保存配置';
                });
        }

        function saveServoConfig() {
            var btn = document.getElementById('btnServoConfig');
            btn.disabled = true;
            btn.textContent = '保存中...';

            var config = {
                openAngle: parseInt(document.getElementById('openAngle').value) || 90,
                openDuration: parseInt(document.getElementById('openDuration').value) || 200,
                closeAngle: parseInt(document.getElementById('closeAngle').value) || 0,
                closeDuration: parseInt(document.getElementById('closeDuration').value) || 200
            };

            fetch('/api/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('舵机配置保存成功', 'success');
                })
                .catch(function () {
                    showToast('舵机配置保存失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '保存舵机配置';
                });
        }

        function testServo() {
            var btn = document.getElementById('btnServoTest');
            btn.disabled = true;
            btn.textContent = '测试中...';

            fetch('/api/open/door', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.error) {
                        showToast('测试失败: ' + data.error, 'error');
                    } else {
                        showToast('舵机测试指令已发送', 'success');
                    }
                })
                .catch(function () {
                    showToast('测试指令发送失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '测试舵机';
                });
        }

        function testConnection() {
            var btn = document.getElementById('btnTestConnection');
            btn.disabled = true;
            btn.textContent = '测试中...';
            setStatus('connecting');
            showToast('正在测试连接...', 'info');

            fetch('/api/mqtt/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.success) {
                        setStatus('connected');
                        showToast('连接成功', 'success');
                    } else {
                        setStatus('disconnected');
                        showToast('连接失败: ' + (data.message || '未知错误'), 'error');
                    }
                })
                .catch(function () {
                    setStatus('disconnected');
                    showToast('连接测试失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '测试连接';
                });
        }

        function loadStatus() {
            fetch('/api/mqtt/status')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    setStatus(data.connected ? 'connected' : 'disconnected');
                })
                .catch(function () {
                    setStatus('disconnected');
                });
        }

        function openDoor() {
            fetch('/api/open/door', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    showToast('开门指令已发送', 'success');
                })
                .catch(function () {
                    showToast('开门指令发送失败', 'error');
                });
        }

        function loadLogs() {
            var filter = document.getElementById('logFilter').value;
            var url = '/api/logs';
            if (filter) {
                url += '?type=' + encodeURIComponent(filter);
            }

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (logs) {
                    var list = document.getElementById('logList');
                    list.innerHTML = '';

                    if (!logs || logs.length === 0) {
                        list.innerHTML = '<div class="log-empty">暂无日志</div>';
                        return;
                    }

                    var reversed = logs.slice().reverse();
                    reversed.forEach(function (log) {
                        var entry = document.createElement('div');
                        entry.className = 'log-entry';

                        var time = document.createElement('span');
                        time.className = 'log-time';
                        time.textContent = log.timestamp || '';

                        var badge = document.createElement('span');
                        badge.className = 'log-badge ' + (log.type || 'info');
                        var typeMap = { send: '发送', receive: '接收', info: '信息', error: '错误' };
                        badge.textContent = typeMap[log.type] || log.type;

                        var content = document.createElement('div');
                        content.className = 'log-content';

                        var message = document.createElement('div');
                        message.className = 'log-message';
                        message.textContent = log.message || '';
                        content.appendChild(message);

                        if (log.payload) {
                            var detail = document.createElement('div');
                            detail.className = 'log-detail collapsed';
                            detail.textContent = (log.topic ? 'Topic: ' + log.topic + '\n' : '') + 'Payload: ' + log.payload;
                            var summary = document.createElement('div');
                            summary.className = 'log-summary';
                            summary.textContent = '点击查看详情';
                            summary.onclick = function () {
                                detail.classList.toggle('collapsed');
                                summary.textContent = detail.classList.contains('collapsed') ? '点击查看详情' : '收起详情';
                            };
                            content.appendChild(summary);
                            content.appendChild(detail);
                        }

                        entry.appendChild(time);
                        entry.appendChild(badge);
                        entry.appendChild(content);
                        list.appendChild(entry);
                    });
                })
                .catch(function () {
                    var list = document.getElementById('logList');
                    list.innerHTML = '<div class="log-empty">加载日志失败</div>';
                });
        }

        function clearLogs() {
            if (!confirm('确定要清空所有日志吗？')) return;

            var btn = document.getElementById('btnClearLogs');
            btn.disabled = true;
            btn.textContent = '清空中...';

            fetch('/api/logs', {
                method: 'DELETE'
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('日志已清空', 'success');
                    loadLogs();
                })
                .catch(function () {
                    showToast('清空日志失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '清空';
                });
        }

        function changePassword() {
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            if (!newPwd || newPwd.length < 4) {
                showToast('密码至少4位', 'error');
                return;
            }
            if (newPwd !== confirmPwd) {
                showToast('两次密码不一致', 'error');
                return;
            }

            var btn = document.getElementById('btnChangePassword');
            btn.disabled = true;
            btn.textContent = '修改中...';

            fetch('/api/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: newPwd })
            })
                .then(function (res) { return res.json(); })
                .then(function () {
                    showToast('密码修改成功', 'success');
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                })
                .catch(function () {
                    showToast('密码修改失败', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '修改密码';
                });
        }

        document.getElementById('btnSaveConfig').onclick = saveConfig;
        document.getElementById('btnTestConnection').onclick = testConnection;
        document.getElementById('btnServoConfig').onclick = saveServoConfig;
        document.getElementById('btnServoTest').onclick = testServo;
        document.getElementById('btnOpenDoor').onclick = openDoor;
        document.getElementById('btnRefreshLogs').onclick = loadLogs;
        document.getElementById('btnClearLogs').onclick = clearLogs;
        document.getElementById('logFilter').onchange = loadLogs;
        document.getElementById('btnLogout').onclick = function () {
            if (!confirm('确定要退出登录吗？')) return;
            fetch('/api/auth/logout', { method: 'POST' })
                .then(function () { window.location.href = '/login'; })
                .catch(function () { window.location.href = '/login'; });
        };
        document.getElementById('btnSaveConfig').onclick = saveConfig;

        document.getElementById('btnChangePassword').onclick = changePassword;

        loadConfig();
        loadStatus();
        loadLogs();

        setInterval(loadLogs, 5000);
    </script>
</body>

</html>
