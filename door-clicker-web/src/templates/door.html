<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Door Clicker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .status-bar {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #bbb;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }

        .status-dot.device-online {
            background: #2196F3;
            box-shadow: 0 0 8px rgba(33, 150, 243, 0.6);
        }

        .status-dot.device-offline {
            background: #FF9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
        }

        .status-dot.device-unknown {
            background: #bbb;
        }

        .device-warning {
            display: none;
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(255, 152, 0, 0.2);
            border: 1px solid #FF9800;
            border-radius: 8px;
            color: #FF9800;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
        }

        .device-warning.show {
            display: block;
        }

        .door-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: linear-gradient(145deg, #4CAF50, #2E7D32);
            border: 6px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 8px;
            cursor: pointer;
            box-shadow:
                0 10px 40px rgba(76, 175, 80, 0.4),
                inset 0 2px 10px rgba(255, 255, 255, 0.2),
                inset 0 -4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .door-btn:active {
            transform: scale(0.95);
            box-shadow:
                0 5px 20px rgba(76, 175, 80, 0.3),
                inset 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .door-btn.pressed {
            background: linear-gradient(145deg, #45a049, #1B5E20);
        }

        .door-btn .label {
            position: relative;
            z-index: 2;
        }

        .door-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .door-btn:active::after {
            width: 300px;
            height: 300px;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 12px;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: #52c41a; }
        .toast.error { background: #ff4d4f; }
        .toast.info { background: #1677ff; }

        @media (max-height: 600px) {
            .door-btn {
                width: 180px;
                height: 180px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot" id="mqttDot"></span>
            <span id="mqttText">MQTT 连接中...</span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="deviceDot"></span>
            <span id="deviceText">设备状态未知</span>
        </div>
    </div>

    <button class="door-btn" id="btnOpenDoor">
        <span class="label">开 门</span>
    </button>

    <div class="device-warning" id="deviceWarning">
        ⚠ 设备离线，开门指令可能无效
    </div>

    <div class="footer">
        <a href="/config">⚙ 配置</a>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || 'info');
            setTimeout(function () {
                toast.className = 'toast';
            }, 2000);
        }

        function setMqttStatus(connected) {
            var dot = document.getElementById('mqttDot');
            var text = document.getElementById('mqttText');
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'MQTT 已连接';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'MQTT 未连接';
            }
        }

        function setDeviceStatus(status) {
            var dot = document.getElementById('deviceDot');
            var text = document.getElementById('deviceText');
            var warning = document.getElementById('deviceWarning');

            dot.classList.remove('device-online', 'device-offline', 'device-unknown');

            if (status === 'online') {
                dot.classList.add('device-online');
                text.textContent = '设备在线';
                warning.classList.remove('show');
            } else if (status === 'offline') {
                dot.classList.add('device-offline');
                text.textContent = '设备离线';
                warning.classList.add('show');
            } else {
                dot.classList.add('device-unknown');
                text.textContent = '设备状态未知';
                warning.classList.remove('show');
            }
        }

        function loadStatus() {
            fetch('/api/mqtt/status')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    setMqttStatus(data.connected);
                    if (data.deviceStatus) {
                        setDeviceStatus(data.deviceStatus);
                    }
                })
                .catch(function () {
                    setMqttStatus(false);
                    setDeviceStatus('unknown');
                });
        }

        function doOpenDoor() {
            var btn = document.getElementById('btnOpenDoor');
            btn.classList.add('pressed');
            btn.style.pointerEvents = 'none';
            var label = btn.querySelector('.label');
            var originalText = label.textContent;
            label.textContent = '开门中...';

            fetch('/api/open/door', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.error) {
                        showToast('发送失败: ' + data.error, 'error');
                    } else {
                        showToast('✓ 开门指令已发送', 'success');
                    }
                })
                .catch(function () {
                    showToast('发送失败，请检查网络', 'error');
                })
                .finally(function () {
                    label.textContent = originalText;
                    setTimeout(function () {
                        btn.classList.remove('pressed');
                        btn.style.pointerEvents = '';
                    }, 500);
                });
        }

        document.getElementById('btnOpenDoor').addEventListener('click', doOpenDoor);

        loadStatus();
        setInterval(loadStatus, 5000);
    </script>
</body>

</html>
