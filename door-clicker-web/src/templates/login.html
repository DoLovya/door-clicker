<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>管理员登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔑</div>
            <div class="login-title">Door Clicker</div>
            <div class="login-subtitle">请登录以访问配置</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" autocomplete="username" placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">登 录</button>
        </form>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        var errorMsg = document.getElementById('errorMsg');
        var form = document.getElementById('loginForm');
        var btnLogin = document.getElementById('btnLogin');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            hideError();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = '登录中...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
                .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
                .then(function (result) {
                    if (result.status === 200 && result.data.success) {
                        var next = new URLSearchParams(window.location.search).get('next') || '/config';
                        window.location.href = next;
                    } else {
                        showError(result.data.error || '登录失败');
                        btnLogin.disabled = false;
                        btnLogin.textContent = '登 录';
                    }
                })
                .catch(function () {
                    showError('网络错误，请重试');
                    btnLogin.disabled = false;
                    btnLogin.textContent = '登 录';
                });
        });

        document.getElementById('username').focus();
    </script>
</body>

</html>
