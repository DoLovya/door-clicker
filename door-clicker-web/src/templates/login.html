<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>管理员登录</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔑</div>
            <div class="login-title">Door Clicker</div>
            <div class="login-subtitle">请登录以访问配置</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" autocomplete="username" placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">登 录</button>
        </form>

        <div style="text-align:center;margin-top:20px;">
            <a href="/" class="back-link" style="margin-right:12px;">← 返回首页</a>
            <a href="https://github.com/DoLovya/door-clicker" target="_blank" rel="noopener" class="back-link" title="GitHub">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
    </div>

    <script>
        var errorMsg = document.getElementById('errorMsg');
        var form = document.getElementById('loginForm');
        var btnLogin = document.getElementById('btnLogin');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            hideError();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = '登录中...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
                .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
                .then(function (result) {
                    if (result.status === 200 && result.data.success) {
                        var next = new URLSearchParams(window.location.search).get('next') || '/config';
                        window.location.href = next;
                    } else {
                        showError(result.data.error || '登录失败');
                        btnLogin.disabled = false;
                        btnLogin.textContent = '登 录';
                    }
                })
                .catch(function () {
                    showError('网络错误，请重试');
                    btnLogin.disabled = false;
                    btnLogin.textContent = '登 录';
                });
        });

        document.getElementById('username').focus();
    </script>
</body>

</html>
