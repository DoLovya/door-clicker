# ============================================================
# Eclipse Mosquitto 配置文件
# 默认针对「本地开发 / 内网可信网络」，允许匿名连接
# ---- 公网部署必读 ----
# 1. 将 allow_anonymous 改为 false
# 2. 取消 password_file 注释，用 mosquitto_passwd 生成用户库
# 3. 建议在 compose 中取消 1883 的对外发布，仅暴露给本机或内网
# ============================================================

# ---- 监听器 ----
listener 1883 0.0.0.0
protocol mqtt

# ---- 持久化 ----
persistence true
persistence_location /mosquitto/data/

# ---- 日志 ----
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- 连接配置 ----
max_connections -1
connection_messages true

# ---- 安全（本地开发默认宽松，公网必须修改）----
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/aclfile
