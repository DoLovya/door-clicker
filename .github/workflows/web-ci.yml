name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r door-clicker-web/requirements.txt

      - name: Run flake8
        run: flake8 door-clicker-web/src/

      - name: Run unit tests
        run: python -m unittest discover -s door-clicker-web/tests -p "*_test.py"
